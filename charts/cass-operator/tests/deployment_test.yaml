suite: deployment
release:
  name: cass-operator
templates:
  - templates/deployment.yaml
tests:
  - it: renders the operator deployment with the expected probes
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: cass-operator
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 65534
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure=false

  - it: omits explicit user and group when OpenShift mode is enabled
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    set:
      openshift.mode: enabled
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: omits explicit user and group when OpenShift mode auto-detects OpenShift
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - security.openshift.io/v1
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsGroup

  - it: keeps explicit user and group when OpenShift mode is disabled
    capabilities:
      apiVersions:
        - cert-manager.io/v1
        - security.openshift.io/v1
    set:
      openshift.mode: disabled
      securityContext.runAsUser: 1000740000
      securityContext.runAsGroup: 1000740000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000740000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1000740000

  - it: configures secure metrics with the requested address
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    set:
      metrics.address: ":9444"
      metrics.tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:9444
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9444
  - it: mounts the externally managed webhook certificate secret
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    set:
      admissionWebhooks.certificateSecret: custom-webhook-cert
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: custom-webhook-cert
  - it: omits the metrics port when metrics are disabled
    capabilities:
      apiVersions:
        - cert-manager.io/v1
    set:
      metrics.address: ":0"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports[1]
